name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: jobut_test
          POSTGRES_USER: jobut_test
          POSTGRES_PASSWORD: jobut_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jobut_test -d jobut_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://jobut_test:jobut_test@127.0.0.1:5432/jobut_test
      AUTH_SECRET: ci-only-auth-secret-with-at-least-32-characters
      APP_URL: http://localhost:3000
      SEP_TERMINAL_ID: ci-placeholder
      SEP_CALLBACK_URL: http://localhost:3000/api/payments/sep/callback
      INTEGRATION_TESTS: "1"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Verify runtime
        run: |
          node --version
          npm --version
      - name: Clean dependency installation
        run: npm ci --ignore-scripts
      - name: TypeScript
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm run test:unit
      - name: Verify, migrate, and test disposable PostgreSQL
        run: npm run test:integration:full
      - name: Production build
        run: npm run build
