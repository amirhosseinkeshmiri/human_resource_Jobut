services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: jobut_test
      POSTGRES_USER: jobut_test
      POSTGRES_PASSWORD: jobut_test
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobut_test -d jobut_test"]
      interval: 2s
      timeout: 3s
      retries: 20
    tmpfs:
      - /var/lib/postgresql/data
